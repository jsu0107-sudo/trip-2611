<style>
:root{ --ground:#F2F4F3; --surface:#FFFFFF; --ink:#0E1113; --ink-2:#4D5558; --control:#C9CFCE; --route:#0B65B0; --bad:#B42318; color-scheme:light }
@media (prefers-color-scheme: dark){ :root{ --ground:#000000; --surface:#121212; --ink:#F2F2F2; --ink-2:#B8B8B8; --control:#3D3D3D; --route:#5AA9E6; --bad:#F28B82; color-scheme:dark } }
*{ box-sizing:border-box }
html,body{ margin:0; background:var(--ground) }
body{ min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px)); color:var(--ink); font:400 16px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", "Noto Sans KR", system-ui, sans-serif; word-break:keep-all; -webkit-font-smoothing:antialiased }
main{ width:min(100%, 360px) }
.mark{ display:block; width:44px; height:44px }
h1{ margin:14px 0 6px; font-size:24px; line-height:1.3; font-weight:700; letter-spacing:-.01em }
p{ margin:0; color:var(--ink-2); font-size:15px }
form{ margin-top:24px; display:grid; gap:8px }
label{ font-size:14px; font-weight:600; color:var(--ink) }
input{ font:inherit; font-size:20px; letter-spacing:.12em; min-height:52px; padding:0 14px; border:1px solid var(--control); border-radius:6px; background:var(--surface); color:var(--ink) }
input:focus-visible, button:focus-visible{ outline:2.5px solid var(--ink); outline-offset:2px }
button{ font:inherit; font-size:16px; font-weight:700; min-height:52px; margin-top:4px; border:0; border-radius:6px; background:var(--ink); color:var(--surface); cursor:pointer; touch-action:manipulation }
button[disabled]{ opacity:.55; cursor:default }
.err{ min-height:1.5em; color:var(--bad); font-size:14px; font-weight:600 }
.wait{ margin-top:24px }
</style>
</head>

<main>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0E1113"/><path d="M17 45Q22 16 47 20" fill="none" stroke="#5AA9E6" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 7.6"/><circle cx="17" cy="45" r="6.6" fill="#FFFFFF"/><circle cx="47" cy="20" r="6.6" fill="#FFFFFF"/></svg>
  <h1>해밀턴·시드니</h1>
  <p>두 사람의 신혼여행 일정이에요. 비밀번호를 넣으면 열리고, 이 휴대폰에서는 다음부터 바로 열려요.</p>
  <p class="wait" id="wait">여는 중이에요…</p>
  <form id="f" hidden>
    <label for="pw">비밀번호</label>
    <input id="pw" name="password" type="password" inputmode="numeric" autocomplete="current-password" required aria-describedby="err">
    <p class="err" id="err" role="alert"></p>
    <button id="go" type="submit">열기</button>
  </form>
  <noscript><p>이 페이지는 자바스크립트를 켜야 열려요.</p></noscript>
</main>

      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.s), iterations: P.it, hash: 'SHA-256' }, b, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function ask(msg) { wait.hidden = true; f.hidden = false; if (msg) err.textContent = msg; pw.focus(); }
  if (!window.crypto || !crypto.subtle || !window.TextDecoder) { ask('이 브라우저에서는 열 수 없어요. Safari나 Chrome 최신 버전으로 열어 주세요.'); return; }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  (saved ? crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']).then(unlock).then(show) : Promise.reject()).catch(function () { ask(); });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = pw.value.trim();
    if (!v) return;
    go.disabled = true; go.textContent = '여는 중…'; err.textContent = '';
    derive(v).then(function (key) {
      return unlock(key).then(function (html) {
        return crypto.subtle.exportKey('raw', key).then(function (raw) {
          try { localStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (x) {}
          show(html);
        });
      });
    }).catch(function () {
      go.disabled = false; go.textContent = '열기';
      err.textContent = '비밀번호가 맞지 않아요. 다시 넣어 주세요.';
      pw.select();
    });
  });
})();
